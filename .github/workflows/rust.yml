name: Rust

on:
  push:
    branches: [ "feature/build-usb-share-desktop-18079143129149631397" ]
  pull_request:
    branches: [ "feature/build-usb-share-desktop-18079143129149631397" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
